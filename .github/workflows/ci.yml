name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tk + a virtual display (Linux runners ship neither)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          # Editable install so importlib.metadata can resolve the version from
          # the installed dist-info — the primary path mesea_operator.version uses.
          pip install -e .
      - name: Run tests (under Xvfb so the Tk view tests run, not skip)
        run: xvfb-run -a python -m pytest tests/ -q
      - name: Smoke (--version equals the single-source version)
        run: |
          REPORTED="$(python -m mesea_operator --version)"
          EXPECTED="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "reported '${REPORTED}', expected '${EXPECTED}'"
          test "$REPORTED" = "$EXPECTED"
